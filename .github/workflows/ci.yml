name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# whisper.cpp uses std::filesystem, which Apple ships from macOS 10.15;
# Tauri's default target is 10.13. Keep in step with bundle.macOS.minimumSystemVersion.
env:
  MACOSX_DEPLOYMENT_TARGET: "10.15"

jobs:
  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Transcription is an optional feature (`whisper`, on by default); the
      # crate has to build and pass without it too, and a second clippy run is
      # far cheaper than a second job.
      - name: Clippy without the optional whisper feature
        run: cargo clippy -p misket --all-targets --no-default-features -- -D warnings
      - run: cargo test --workspace
      - name: Test without the optional whisper feature
        run: cargo test -p misket --no-default-features

  build-debug:
    name: Debug build (${{ matrix.os }})
    if: github.event_name == 'push'
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug --no-bundle --ci

  e2e:
    name: E2E smoke (Linux, WebDriver)
    runs-on: ubuntu-22.04
    needs: [frontend, rust]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies and WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - run: xvfb-run -a pnpm test
        working-directory: e2e
