[package]
name = "misket"
description = "Misket: open-source qualitative coding for text, images and video"
authors = ["İzge Bayyurt"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "misket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# On by default so release builds ship offline transcription; the crate must
# still compile and pass its tests with `--no-default-features`, which leaves
# everything but the inference engine in place (see `crate::transcribe`).
default = ["whisper"]
whisper = ["dep:whisper-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
misket-core = { path = "../crates/misket-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
ureq = { version = "2", default-features = true }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
url = "2"
sha1 = "0.10"
symphonia = { version = "0.5", default-features = false, features = [
  "aac",
  "adpcm",
  "alac",
  "flac",
  "isomp4",
  "mkv",
  "mp3",
  "ogg",
  "pcm",
  "vorbis",
  "wav",
] }
whisper-rs = { version = "0.15", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
